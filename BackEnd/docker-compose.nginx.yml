# Nginx-only stack: reverse proxy + round-robin load balancer → Node on the host.
#
# Expectation:
#   - Two API processes on host: PORT=3000 and PORT=3001 (see package.json dev:3000 / dev:3001).
#   - Requests: http://localhost/api/...  (not :3000 — that bypasses nginx).
#
# Start:
#   docker compose -f docker-compose.nginx.yml up -d
#
# Frontend (.env): VITE_API_URL=http://localhost/api

services:
  nginx:
    image: nginx:alpine
    container_name: trustfund-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
